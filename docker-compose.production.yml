services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SENTRIX_DOMAIN: ${SENTRIX_DOMAIN:?Set SENTRIX_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - media-relay
    networks:
      - application
      - media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      DOCKER_BACKEND_URL: http://backend:8000
      DOCKER_MEDIA_RELAY_URL: http://media-relay:8888
    depends_on:
      - backend
    networks:
      - application

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_AI: "true"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${SENTRIX_DOMAIN:?Set SENTRIX_DOMAIN in deploy/.env},localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SENTRIX_DOMAIN:?Set SENTRIX_DOMAIN in deploy/.env}
      CORS_ALLOW_ALL_ORIGINS: "false"
      CORS_ALLOWED_ORIGINS: https://${SENTRIX_DOMAIN:?Set SENTRIX_DOMAIN in deploy/.env}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_DB_ENGINE: postgis
      DJANGO_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      DJANGO_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      DJANGO_DB_HOST: database
      DJANGO_DB_PORT: "5432"
      SENTRIX_STATE_STORAGE: postgres
      MEDIA_RELAY_BASE_URL: http://media-relay:8888
      MEDIA_RELAY_WEBRTC_URL: http://media-relay:8889
      MEDIA_RELAY_API_URL: http://media-relay:9997
      MEDIA_RELAY_ENABLED: "true"
      AUTH_ALLOW_DEMO_USERS: "false"
      AUTH_ALLOW_DEMO_OTP: "false"
      SENTRIX_ENABLE_DEMO_DATA: "false"
      AI_DEVICE: cpu
    volumes:
      - backend_data:/app/.localdata
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py check --deploy &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers 1 --timeout 90 --access-logfile - --error-logfile -
    networks:
      - application
      - media
      - storage

  database:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage

  media-relay:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - media

networks:
  application:
  media:
    internal: true
  storage:
    internal: true

volumes:
  backend_data:
  database_data:
  caddy_data:
  caddy_config:
