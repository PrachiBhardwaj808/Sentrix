# MediaMTX Configuration for Sentrix
logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: 127.0.0.1:8554

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

paths:
  all_others:
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 15s
    sourceProtocol: tcp
    readTimeout: 10s
    writeTimeout: 10s
    readBufferCount: 2048
