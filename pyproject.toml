[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["venv", ".venv", "__pycache__", ".localdata", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S310", "S603"]

[tool.black]
line-length = 120
target-version = ["py312"]
exclude = "venv|.venv|__pycache__|\\.localdata"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/venv/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
